; =====================================================
; RoboBot - Self Balancing + Obstacle Detection Car
; Platform : ESP32
; Framework: Arduino (PlatformIO)
; =====================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial Monitor Speed
monitor_speed = 115200

; Upload Speed
upload_speed = 921600

; Deep library dependency discovery
lib_ldf_mode = deep+

; Required Libraries
lib_deps =
    olikraus/U8g2@^2.35.9
    WebServer

; Build Flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I"C:/Users/Fahim Hossain/.platformio/packages/framework-arduinoespressif32/libraries/Network/src"
    -I"C:/Users/Fahim Hossain/.platformio/packages/framework-arduinoespressif32/libraries/WebServer/src"

; Partition Table (extra app space)
board_build.partitions = min_spiffs.csv
